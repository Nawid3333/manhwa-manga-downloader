[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manhwa-manga-downloader"
version = "0.1.0"
description = "Multi-site async manhwa/manga downloader (httpx + lxml)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.28.1",
    "lxml>=6.1.3",
    "rich>=13.9.4",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.6.0", "pyright>=1.1.400"]

[project.scripts]
mangadl = "main:main"

[tool.setuptools]
py-modules = ["main", "config", "term"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ==================== RELEASE AUTOMATION ====================
# Version is bumped automatically by python-semantic-release, driven by
# Conventional Commits (feat:/fix:/BREAKING CHANGE) on every push to main --
# see .github/workflows/auto-release.yml. Don't bump `version` above by hand;
# the next automated run will just move it again.
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_message = "chore(release): {version}"
commit_author = "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

# ==================== TYPE CHECKING ====================
# Ruff has no type inference; pyright does. Run both:
#   ruff check . && ruff format --check . && pyright
[tool.pyright]
include = ["main.py", "config.py", "term.py", "src"]
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "build", "dist"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
reportMissingTypeStubs = false

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
# The repo normalizes to LF via .gitattributes; "native" would demand CRLF on
# Windows runners and fail format --check against the LF blobs.
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["config", "term", "src", "main"]