[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manhwa-manga-downloader"
version = "1.2.0"
description = "Multi-site async manhwa/manga downloader (httpx + lxml)."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.28.1",
    "lxml>=6.1.3",
    "rich>=13.9.4",
    "pillow>=11.0.0",
]

[project.optional-dependencies]
# numpy is only needed by tests/benchmark_convert.py's synthetic images.
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "ruff>=0.6.0", "pyright>=1.1.400", "numpy>=2.1.0"]

[project.scripts]
mangadl = "main:main"

[tool.setuptools]
py-modules = ["main", "config", "term"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ==================== TESTING ====================
# The test suite is fully hermetic -- driver network calls go through
# httpx.MockTransport, never the live sites (see tests/conftest.py).
# tests/benchmark_convert.py is a standalone script, not part of this run
# (it doesn't match the test_*.py pattern).
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# ==================== RELEASE AUTOMATION ====================
# Version is bumped automatically by python-semantic-release, driven by
# Conventional Commits (feat:/fix:/BREAKING CHANGE) on every push to main --
# see .github/workflows/auto-release.yml. Don't bump `version` above by hand;
# the next automated run will just move it again.
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_message = "chore(release): {version}"
commit_author = "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

# ==================== TYPE CHECKING ====================
# Ruff has no type inference; pyright does. Run both:
#   ruff check . && ruff format --check . && pyright
[tool.pyright]
include = ["main.py", "config.py", "term.py", "src"]
# tests/ holds helper scripts that talk to live sites or benchmark hardware
# (Aniworld convention); they are tools, not code under analysis.
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "build",
    "dist",
    "tests",
]
typeCheckingMode = "basic"
pythonVersion = "3.11"
reportMissingTypeStubs = false

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
# The repo normalizes to LF via .gitattributes; "native" would demand CRLF on
# Windows runners and fail format --check against the LF blobs.
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["config", "term", "src", "main"]
