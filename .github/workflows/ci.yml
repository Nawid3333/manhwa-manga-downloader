# Runs lint, type check, and the (fully hermetic) test suite on every push
# and pull request. Drivers talk to live sites, which CI cannot do reliably,
# so tests go through httpx.MockTransport instead -- see tests/conftest.py.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # runner-images.yml runs this on a new runner image, before and after
  # windows-latest moves to it.
  workflow_call:
    inputs:
      # No Linux job here; accepted so that every repository's CI takes the same inputs.
      linux-runner:
        type: string
        default: ubuntu-latest
      windows-runner:
        type: string
        default: windows-latest

permissions:
  contents: read

jobs:
  lint:
    runs-on: ${{ inputs.windows-runner || 'windows-latest' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The floor declared in requires-python: testing the oldest
          # supported version is what catches a newer-only API slipping in.
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ".[dev]"
          # Not installed for its own sake -- CI never runs a real browser --
          # just so pyright can resolve src/sites/mangago.py's import.
          pip install ".[mangago]"

      - name: Lint
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

      - name: Type check
        run: python -m pyright

      - name: Test
        run: python -m pytest
